<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
body { font-family: Arial; text-align: center; padding: 50px; }
input { padding: 10px; font-size: 16px; }
button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
pre { text-align: left; max-width: 600px; margin: 20px auto; background:#1e1e1e; color:#00ff00; padding:15px; border-radius:10px; }
</style>
</head>
<body>
<h1>Even or Odd Checker</h1>
<input type="number" id="num" placeholder="Number enter chey"> 
<button onclick="check()">Check</button>
<h2 id="result"></h2>
<script>
function check() {
let n = document.getElementById("num").value;
if(n % 2 == 0) document.getElementById("result").innerText = "Even Number";
else document.getElementById("result").innerText = "Odd Number";
}
</script>
<h2>C Language Code</h2>
<pre>
#include &lt;stdio.h&gt;
int main() {
 int num;
 printf("Enter a number: ");
 scanf("%d", &num);
 if(num % 2 == 0)
  printf("Even Number");
 else
  printf("Odd Number");
 return 0;
}
</pre>
</body>
</html>
